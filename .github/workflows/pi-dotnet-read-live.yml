name: Live pinned Pi vs C# bounded read comparison
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/pi-dotnet-read-live.yml'
      - 'scripts/compare_pi_read_live.mjs'
      - 'candidates/dotnet-aot/**'
      - 'sources.json'
permissions:
  contents: read
jobs:
  live-comparison:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            exe: Probe
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            exe: Probe
          - os: windows-2025
            rid: win-x64
            exe: Probe.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Pin original Pi source
        shell: pwsh
        run: |
          python scripts/checkout.py pi_ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build official Pi without paid APIs
        shell: pwsh
        working-directory: vendor/pi_ts
        run: |
          npm install --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run hydrate:model-data
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:offline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile C# Native AOT
        shell: pwsh
        run: |
          dotnet publish candidates/dotnet-aot/Probe.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishAot=true -o candidates/dotnet-aot/out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Direct tool output comparison
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force results | Out-Null
          node scripts/compare_pi_read_live.mjs "candidates/dotnet-aot/out/${{ matrix.exe }}" "results/live-pi-read-${{ matrix.rid }}.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-pi-read-${{ matrix.rid }}
          path: results/live-pi-read-${{ matrix.rid }}.json
          if-no-files-found: ignore
